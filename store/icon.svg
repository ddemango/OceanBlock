<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b8fe6"/><stop offset="1" stop-color="#8fe0ff"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16b3d9"/><stop offset="1" stop-color="#0a6aa8"/></linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd08a"/><stop offset=".45" stop-color="#c7863a"/><stop offset="1" stop-color="#6e3f15"/></linearGradient>
    <radialGradient id="boom" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6c4"/><stop offset=".5" stop-color="#ffb13b"/><stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="820" cy="190" r="90" fill="#fff6c4" opacity=".85"/>
  <path d="M0 560 Q256 520 512 560 T1024 560 V1024 H0Z" fill="url(#sea)"/>
  <!-- raft -->
  <rect x="470" y="520" width="440" height="56" rx="20" fill="#c98b4e" stroke="#23324a" stroke-width="14"/>
  <!-- crate tower (tumbling) -->
  <g stroke="#23324a" stroke-width="14" stroke-linejoin="round">
    <rect x="520" y="400" width="120" height="120" rx="10" fill="#f0a24b"/>
    <rect x="660" y="400" width="120" height="120" rx="10" fill="#2fb3a5"/>
    <rect x="800" y="400" width="100" height="120" rx="10" fill="#f0a24b"/>
    <rect x="600" y="270" width="120" height="120" rx="10" fill="#e85d75" transform="rotate(-14 660 330)"/>
    <rect x="760" y="230" width="120" height="120" rx="10" fill="#f0a24b" transform="rotate(22 820 290)"/>
  </g>
  <g fill="none" stroke="#7a4318" stroke-width="10" stroke-linecap="round">
    <path d="M545 425 L615 495 M615 425 L545 495"/><path d="M825 425 L875 495 M875 425 L825 495"/>
  </g>
  <!-- impact burst -->
  <circle cx="640" cy="360" r="150" fill="url(#boom)"/>
  <!-- cannonball -->
  <circle cx="520" cy="420" r="46" fill="#2a3140" stroke="#23324a" stroke-width="12"/>
  <circle cx="505" cy="405" r="12" fill="#8a96a8"/>
  <!-- splashes -->
  <g fill="#ffffff"><circle cx="480" cy="590" r="26"/><circle cx="930" cy="585" r="22"/><circle cx="455" cy="560" r="14"/><circle cx="960" cy="555" r="12"/></g>
  <!-- cannon -->
  <g stroke="#23324a" stroke-width="16" stroke-linejoin="round">
    <rect x="70" y="700" width="380" height="120" rx="30" fill="#1f8a8a"/>
    <path d="M140 720 L430 520 L500 610 L215 815 Z" fill="url(#bronze)"/>
    <ellipse cx="465" cy="565" rx="58" ry="70" transform="rotate(-36 465 565)" fill="#7a4a1c"/>
    <ellipse cx="465" cy="565" rx="30" ry="38" transform="rotate(-36 465 565)" fill="#23324a"/>
    <circle cx="150" cy="840" r="70" fill="#5a3b22"/><circle cx="370" cy="840" r="70" fill="#5a3b22"/>
  </g>
  <circle cx="150" cy="840" r="22" fill="#f4e3b5"/><circle cx="370" cy="840" r="22" fill="#f4e3b5"/>
  <g fill="#fff3c4" opacity=".9"><circle cx="540" cy="500" r="20"/><circle cx="575" cy="470" r="12"/></g>
</svg>
