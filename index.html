<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b9fc9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Tidebreaker</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- In-game HUD -->
    <div id="hud" class="hidden">
      <div class="hud-left">
        <div class="pill level-pill">Level <span id="hud-level">1</span></div>
        <div class="pill ammo-pill"><span class="ball-icon"></span><span id="hud-shots">30</span></div>
      </div>
      <div class="hud-right">
        <div class="pill bomb-pill" id="bomb-pill" title="Bomb shot"><span class="bomb-icon"></span><span class="bomb-meter"><i id="bomb-fill"></i></span></div>
        <button id="btn-settings" class="round-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.6 4.9-1.9 1.1.1 1.6-1.4 2.4-1.9-.3-1.3 1-.4 1.8h-2.8l-.4-1.8-1.3-1-1.9.3-1.4-2.4.1-1.6-1.9-1.1v-2.8l1.9-1.1-.1-1.6 1.4-2.4 1.9.3 1.3-1 .4-1.8h2.8l.4 1.8 1.3 1 1.9-.3 1.4 2.4-.1 1.6 1.9 1.1Z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>

    <div id="hud-progress" class="hidden"><div class="bar"><i id="progress-fill"></i></div><span><span id="hud-left">0</span> left</span></div>
    <div id="popups"></div>

    <!-- Home screen -->
    <div id="home" class="screen">
      <div class="topbar">
        <div class="pill coin-pill"><span class="coin-icon"></span><span class="coins">0</span></div>
        <div class="pill heart-pill"><span class="heart-icon"><span class="lives">5</span></span><span class="lives-label">FULL</span></div>
      </div>
      <div class="logo">
        <div class="logo-top">TIDE</div>
        <div class="logo-bottom">BREAKER</div>
        <div class="logo-sub">sink the cargo · save the cannonballs</div>
      </div>
      <button id="btn-play" class="big-btn">Play<small>Level <span id="home-level">1</span></small></button>
    </div>

    <!-- Win screen -->
    <div id="win" class="screen hidden">
      <div class="topbar">
        <div class="pill coin-pill"><span class="coin-icon"></span><span class="coins">0</span></div>
        <div class="pill heart-pill"><span class="heart-icon"><span class="lives">5</span></span><span class="lives-label">FULL</span></div>
      </div>
      <div class="win-title"><small>Level <span id="win-level">1</span></small>CLEARED!</div>
      <div class="stars"><span></span><span></span><span></span></div>
      <div class="medal">
        <div class="medal-glow"></div>
        <div class="medal-coins"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="medal-face"><svg viewBox="0 0 100 100"><g fill="none" stroke="#7a4a10" stroke-width="7" stroke-linecap="round"><circle cx="50" cy="24" r="8"/><path d="M50 32v44M36 44h28M24 58c4 14 14 20 26 20s22-6 26-20"/></g></svg></div>
      </div>
      <div class="reward"><span class="coin-icon"></span>+<span id="win-coins">0</span></div>
      <div class="detail light" id="win-detail"></div>
      <button id="btn-next" class="big-btn">Continue</button>
    </div>

    <!-- Fail screen -->
    <div id="fail" class="screen hidden dim">
      <div class="card">
        <div class="ribbon red">Out of Cannonballs</div>
        <div class="detail"><span id="fail-left">0</span> pieces of cargo are still afloat.</div>
        <button id="btn-extra" class="big-btn green">+5 Shots<small><span class="coin-icon small"></span> 60</small></button>
        <button id="btn-retry" class="text-btn">Give up &amp; retry (−1 <span class="heart-mini"></span>)</button>
      </div>
    </div>

    <!-- No lives -->
    <div id="nolives" class="screen hidden dim">
      <div class="card">
        <div class="ribbon red">No Hearts Left</div>
        <div class="detail">Next heart in <span id="heart-timer">--:--</span></div>
        <button id="btn-refill" class="big-btn green">Refill<small><span class="coin-icon small"></span> 120</small></button>
        <button id="btn-nolives-home" class="text-btn">Back</button>
      </div>
    </div>

    <!-- Settings -->
    <div id="settings" class="screen hidden dim">
      <div class="card">
        <div class="ribbon">Settings</div>
        <label class="toggle"><span>Sound</span><input type="checkbox" id="opt-sound" checked /><i></i></label>
        <label class="toggle"><span>Vibration</span><input type="checkbox" id="opt-vibe" checked /><i></i></label>
        <button id="btn-resume" class="big-btn">Resume</button>
        <button id="btn-restart" class="text-btn">Restart level (−1 <span class="heart-mini"></span>)</button>
        <button id="btn-home" class="text-btn">Home</button>
      </div>
    </div>

    <div id="toast" class="hidden"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
